# Only forward the three host-side development ports into the internal Docker network.
worker_processes 1;
error_log stderr warn;
pid /tmp/thinktrace-nginx.pid;
events { worker_connections 256; }
stream {
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 8000;
        set $destination supabase_kong_thinktrace:8000;
        proxy_pass $destination;
    }
    server {
        listen 5432;
        set $destination supabase_db_thinktrace:5432;
        proxy_pass $destination;
    }
    server {
        listen 8025;
        set $destination supabase_inbucket_thinktrace:8025;
        proxy_pass $destination;
    }
}
