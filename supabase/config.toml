project_id = "thinktrace"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17
port = 54322
shadow_port = 54320

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your ThinkTrace sign-in code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Confirm your ThinkTrace account"
content_path = "./supabase/templates/code.html"

[local_smtp]
enabled = true
port = 54324

[analytics]
enabled = false

[studio]
enabled = false

[edge_runtime]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false
